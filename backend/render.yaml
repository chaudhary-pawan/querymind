services:
  - type: web
    name: querymind-t6p6
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set this in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.10.0
